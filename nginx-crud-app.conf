limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	client_max_body_size 16k;

	location ~ ^/api/(login|register)$ {
		limit_req zone=auth burst=10 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

# To turn on HTTPS (needs a domain name that points to this droplet):
#   1. sudo apt install certbot python3-certbot-nginx
#   2. sudo certbot --nginx -d YOUR.DOMAIN
#   Certbot adds the "listen 443 ssl" block and the redirect from port 80.
#   The X-Forwarded-Proto line above then makes the app set the Secure cookie flag and the HSTS header.

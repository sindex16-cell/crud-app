<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 1 Notes</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <strong>HSK 1 Notes</strong>
  <span><span id="who"></span><button id="logout">Log out</button></span>
</header>
<main>
  <input id="search" placeholder="Search by character, pinyin or meaning">
  <div id="grid"></div>
  <section id="detail" class="hidden">
    <h2 id="d-hanzi"></h2>
    <div id="d-info"></div>
    <h3>Descriptions</h3>
    <div id="d-list"></div>
    <h3>Your description</h3>
    <textarea id="d-text" rows="3" maxlength="1000" placeholder="Describe how this word is written."></textarea>
    <div class="row">
      <button id="save">Save</button>
      <button id="remove" class="secondary">Delete mine</button>
    </div>
    <div id="msg" class="error"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>

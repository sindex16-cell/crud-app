<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 1 Notes</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <strong>HSK 1 Notes</strong>
  <span><span id="who"></span><button id="logout">Log out</button></span>
</header>
<main>
  <div>
    <label for="search" class="sr-only">Search words</label>
    <input id="search" placeholder="Search by character, pinyin or meaning">
    <div class="legend"><span style="color:var(--green);font-weight:700">&#10003;</span> You wrote a description. The number at the top right is the count of descriptions from all users.</div>
    <div id="grid"></div>
    <div id="empty" class="hidden">No words found.</div>
  </div>
  <div>
    <div id="detail-hint">Select a word to read and write descriptions.</div>
    <section id="detail" class="hidden" aria-live="polite">
      <button id="close" aria-label="Close">&times;</button>
      <h2 id="d-hanzi" lang="zh"></h2>
      <div id="d-info"></div>
      <h3>Descriptions from other users</h3>
      <div id="d-list"></div>
      <h3><label for="d-text">Your description</label></h3>
      <textarea id="d-text" rows="3" maxlength="1000" placeholder="Describe how this word is written."></textarea>
      <div class="row">
        <button id="save">Save</button>
        <button id="remove" class="link">Delete mine</button>
      </div>
      <div id="msg" role="status"></div>
      <a id="relogin" href="/" class="hidden">Log in again</a>
    </section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
